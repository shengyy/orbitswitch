[package]
name = "orbitswitch"
version = "0.2.1"
description = "Menu bar / tray accounts and quotas for Antigravity, Codex and Claude"
authors = ["OrbitSwitch contributors"]
license = "MIT"
repository = "https://github.com/shengyy/orbitswitch"
edition = "2024"
rust-version = "1.99"

[lib]
name = "orbitswitch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-positioner = { version = "2.4", features = ["tray-icon"] }
tauri-plugin-opener = "2.7"
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-log = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt-multi-thread", "process"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "native-tls", "http2", "charset", "system-proxy"] }
base64 = "0.23"
sha2 = "0.11"
getrandom = "0.4"
url = "2.5"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
memchr = "2"
auto-launch = "0.6"
sys-locale = "0.3"
log = "0.4"
tauri-plugin-updater = "2.13"
toml = "1.1"
unicode-normalization = "0.1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = "0.12"
sha1 = "0.10"
aes-gcm = "0.10"
rusqlite = { version = "0.38", features = ["bundled"] }

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }
window-vibrancy = "0.8"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
