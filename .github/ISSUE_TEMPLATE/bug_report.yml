name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please never paste tokens or account emails; OrbitSwitch's logs don't contain tokens, but check before attaching.
  - type: input
    id: version
    attributes:
      label: OrbitSwitch version
      description: Shown at the top of the `⋯` menu.
      placeholder: "0.2.1"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and version
      placeholder: "macOS 26.1 / Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and version
      placeholder: "Antigravity 2.26.0 / Codex 0.164.0 / Claude Code 2.1.310"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: "`⋯` → Show Logs. Paste only the lines around the problem."
      render: text
