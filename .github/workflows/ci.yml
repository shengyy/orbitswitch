name: CI

# PR checks: skipped while the PR is a draft (GitHub records them as skipped),
# run once it is marked ready and on every later push. Merging into main does
# not run them again. The "Protect main" ruleset requires `gate` and an
# up-to-date branch.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check (${{ matrix.os }})
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Same key in CI and Release so PR checks can restore what main saved (OS/arch stay in the key).
          shared-key: tauri
          # PR runs restore the cache saved by main release builds and never save their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bun install --frozen-lockfile
      - name: Frontend checks
        run: bun run check
      - name: Quota behavior tests
        run: bun run test
      - name: Frontend build
        run: bun run build
      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # The single required check: passes only when every platform passed.
  gate:
    name: gate
    if: always() && github.event.pull_request.draft == false
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every platform passed
        run: test "${{ needs.check.result }}" = "success"
