name: Release
run-name: Release v${{ inputs.version }} by @${{ github.actor }}

# Started by hand from the Actions tab on main. Builds the macOS and Windows
# installers from main's current commit and attaches them to a draft release
# tagged v<version>; publishing the draft creates the tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, exactly as in src-tauri/Cargo.toml (for example 0.1.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  authorize:
    name: Authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Only from main
        run: test "${{ github.ref }}" = "refs/heads/main" || { echo "::error::Run the release from main."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version matches Cargo.toml and is not released yet
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          declared="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)"
          test "$declared" = "$VERSION" || { echo "::error::Cargo.toml declares $declared, not $VERSION."; exit 1; }
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists."; exit 1
          fi

  build:
    name: build (${{ matrix.os }})
    needs: authorize
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # The action reads/merges/replaces latest.json; keep its writers serial.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Add both Apple targets for a universal build
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Same key in CI and Release so PR checks can restore what main saved (OS/arch stay in the key).
          shared-key: tauri
          # Release runs on main are the only cache writers; PR checks restore this cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bun install --frozen-lockfile
      - name: Release notes from the changelog
        id: notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PYTHON'
          import os, re, uuid
          from pathlib import Path
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(r"^## \[" + re.escape(os.environ["VERSION"]) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", changelog, re.M | re.S)
          if not match or not match[1].strip():
              raise SystemExit("Missing release notes in CHANGELOG.md")
          delimiter = str(uuid.uuid4())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"body<<{delimiter}\n{match[1].strip()}\n{delimiter}\n")
          PYTHON
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: bun tauri
          args: ${{ matrix.args }}
          tagName: v${{ inputs.version }}
          releaseCommitish: ${{ github.sha }}
          releaseName: OrbitSwitch ${{ inputs.version }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          updaterJsonPreferNsis: true
